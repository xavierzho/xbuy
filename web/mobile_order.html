<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>私享订单 · 查单中心</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap");

:root {
  --bg: #f6f7f6;
  --bg2: #ffffff;
  --border: #e0e0dc;
  --control: #d1d5db;
  --accent: #8b6914;
  --text: #121218;
  --muted: #5c5c66;
  --faint: #5f6368;
  --positive: #247b50;
  --negative: #c4242a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px 16px 40px;
  -webkit-font-smoothing: antialiased;
}
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

.app { width: min(100%, 520px); margin: 0 auto; }
.top { margin-bottom: 16px; }
.clock {
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  margin-bottom: 6px;
}
.title {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.signal { margin-top: 8px; font-size: 16px; line-height: 1.45; }

.panel { margin-bottom: 12px; }
.block-title, .status-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}
.phone-box {
  width: 100%;
  min-height: 96px;
  resize: vertical;
  padding: 10px 12px;
  border: 1px solid var(--control);
  border-radius: 8px;
  background: var(--bg2);
  font-size: 16px;
  line-height: 1.45;
}
.phone-box:focus { border-color: var(--text); outline: none; }
.phone-box::placeholder { color: var(--faint); }

.primary {
  width: 100%;
  height: 44px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 18px;
}
.primary:disabled { background: #e7e5df; color: var(--faint); cursor: not-allowed; }

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.status-name { margin: 0; }
.auto {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
}
.switch {
  width: 32px;
  height: 18px;
  padding: 2px;
  border: none;
  border-radius: 999px;
  background: #d5d3cc;
}
.switch span {
  display: block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
}
.switch.on { background: #1d1f20; }
.switch.on span { transform: translateX(14px); }

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 12px;
}
.metric { padding: 12px 14px; }
.metric + .metric { border-left: 1px solid var(--border); }
.metric strong {
  display: block;
  font-size: 20px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.metric span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

.table {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.thead, .row {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.8fr) minmax(0, 1.2fr);
}
.thead {
  font-size: 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.thead div, .cell { padding: 10px 12px; min-width: 0; }
.row { border-top: 1px solid #f0f0ee; align-items: start; }
.row:first-of-type { border-top: none; }
.phone, .asset { font-size: 14px; font-weight: 500; }
.phone { font-variant-numeric: tabular-nums; }
.sub { margin-top: 2px; font-size: 12px; line-height: 1.4; color: var(--muted); word-break: break-all; }
.empty { padding: 28px 12px; font-size: 14px; color: var(--muted); }
.pay-cell { display: flex; flex-direction: column; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.detail, .pay-btn, .copy, .open {
  height: 32px;
  padding: 0 10px;
  border-radius: 6px;
  border: 1px solid var(--control);
  background: var(--bg2);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.detail:disabled, .pay-btn:disabled { color: var(--faint); cursor: not-allowed; }
.pay-btn.alipay, .pay-btn.ysf-android, .pay-btn.ysf-ios { background: var(--bg2); }

.toast {
  position: fixed;
  left: 50%;
  top: 16px;
  transform: translateX(-50%);
  opacity: 0;
  pointer-events: none;
  max-width: min(420px, calc(100% - 32px));
  padding: 12px 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  font-size: 14px;
  z-index: 40;
}
.toast.show { opacity: 1; }

.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
  background: rgba(18, 18, 24, 0.4);
  z-index: 30;
}
.modal.show { display: flex; }
.sheet {
  width: min(440px, 100%);
  background: var(--bg2);
  border-radius: 16px 16px 12px 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: 600;
}
.close {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  font-size: 22px;
  line-height: 1;
  color: var(--text);
}
.sheet-body { padding: 0 16px 16px; }
.link-box {
  font-size: 13px;
  line-height: 1.45;
  word-break: break-all;
  color: var(--text);
  margin-bottom: 12px;
}
.sheet-actions { display: flex; gap: 8px; }
.copy, .open { flex: 1; }

@media (max-width: 640px) {
  .thead { display: none; }
  .row { grid-template-columns: 1fr; gap: 4px; padding: 4px 0 8px; }
  .cell { padding: 4px 12px; }
}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="clock" id="clock">--:--</p>
      <h1 class="title">私享订单</h1>
      <p class="signal">粘贴手机号，查出待支付的单。</p>
    </header>

    <section class="panel">
      <h2 class="block-title">手机号</h2>
      <label class="sr" for="phoneInput">手机号，每行一个</label>
      <textarea id="phoneInput" class="phone-box" inputmode="numeric" placeholder="每行一个手机号"></textarea>
    </section>

    <button id="scanBtn" class="primary" type="button">查询</button>

    <section class="status-row">
      <h2 class="status-name">结果</h2>
      <label class="auto">
        <span>每 60 秒再查</span>
        <button id="autoSwitch" class="switch" type="button" aria-label="切换自动刷新"><span></span></button>
      </label>
    </section>

    <section class="summary" aria-label="这次查询">
      <div class="metric"><strong id="totalNum">0</strong><span>号码</span></div>
      <div class="metric"><strong id="hitNum">0</strong><span>查到</span></div>
      <div class="metric"><strong id="costNum">0ms</strong><span>耗时</span></div>
    </section>

    <section class="table">
      <div class="thead">
        <div>手机号</div>
        <div>订单</div>
        <div>支付</div>
      </div>
      <div id="rows">
        <div class="empty">等待查询</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head">
        <div id="modalTitle">支付链接</div>
        <button id="closeModal" class="close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="sheet-body">
        <div id="linkBox" class="link-box"></div>
        <div class="sheet-actions">
          <button id="copyBtn" class="copy" type="button">复制链接</button>
          <a id="openBtn" class="open" href="#" target="_blank" rel="noopener">打开链接</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const remoteToken = qs.get('token') || qs.get('remoteToken') || '';
    const rowsEl = document.getElementById('rows');
    const phoneInput = document.getElementById('phoneInput');
    const scanBtn = document.getElementById('scanBtn');
    const autoSwitch = document.getElementById('autoSwitch');
    const toastEl = document.getElementById('toast');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const linkBox = document.getElementById('linkBox');
    const copyBtn = document.getElementById('copyBtn');
    const openBtn = document.getElementById('openBtn');
    let rows = [];
    let currentLink = '';
    let autoTimer = null;
    let busy = false;

    function tickClock() {
      const d = new Date();
      document.getElementById('clock').textContent =
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    tickClock();
    setInterval(tickClock, 15000);

    function toast(text) {
      toastEl.textContent = String(text || '');
      toastEl.classList.add('show');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    async function api(path, payload) {
      const body = Object.assign({}, payload || {});
      if (remoteToken) body.remoteToken = remoteToken;
      const res = await fetch(path, {
        method: 'POST',
        headers: Object.assign(
          { 'Content-Type': 'application/json' },
          remoteToken ? { 'X-Remote-Login-Token': remoteToken } : {}
        ),
        body: JSON.stringify(body),
      });
      const text = await res.text();
      let json = null;
      try {
        json = text ? JSON.parse(text) : {};
      } catch (e) {
        throw new Error('返回不是 JSON: ' + text.slice(0, 160));
      }
      if (!res.ok || !json.ok) {
        throw new Error((json && (json.message || json.detail)) || ('HTTP ' + res.status));
      }
      return json.data;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[c]));
    }

    function parsePhones() {
      return String(phoneInput.value || '')
        .replace(/\uFF0C|\uFF1B/g, ',')
        .split(/[\s,;]+/)
        .map(x => x.trim())
        .filter(Boolean);
    }

    function channelName(ch) {
      if (ch === '70') return '支付宝';
      if (ch === '80_android') return '云闪付安卓';
      if (ch === '80_ios') return '云闪付iOS';
      if (ch === '80') return '云闪付安卓';
      return '支付';
    }

    function pickPayLink(data, channel) {
      if (!data) return '';
      if (channel === '70') {
        return data.alipayH5PayUrl || data.alipayUrl || data.payUrlHttps || data.payUrl || '';
      }
      if (channel === '80_ios') {
        return data.ysfIosUrl || '';
      }
      if (channel === '80_android' || channel === '80') {
        return data.ysfAndroidUrl || data.ysfUrl || data.payUrl || '';
      }
      return data.payUrl || '';
    }

    function render() {
      if (!rows.length) {
        rowsEl.innerHTML = '<div class="empty">等待查询</div>';
        return;
      }
      rowsEl.innerHTML = rows.map((r, idx) => {
        const ok = !!r.ok && !!r.orderId;
        const hasNotice = !!r.hasPayNotice;
        const phone = esc(r.phone || '');
        const oid = esc(r.orderId || '');
        const status = esc(r.status || r.message || '');
        const time = esc(r.time || '');
        const asset = esc(r.assetType || '-');
        const payDisabled = (ok && hasNotice) ? '' : 'disabled';
        const pickupDisabled = ok ? '' : 'disabled';
        const payHint = ok ? (hasNotice ? '电脑端已提取' : '未提取支付链接') : esc(r.message || '未查到订单');
        return `
          <div class="row">
            <div class="cell">
              <div class="phone">${phone}</div>
              <div class="sub">${oid || esc(r.message || '未查到订单')}</div>
              ${time ? `<div class="sub">${time}</div>` : ''}
            </div>
            <div class="cell"><div class="asset">${asset}</div><div class="sub">${status}</div></div>
            <div class="cell pay-cell">
              <button class="detail" type="button" data-pickup="${idx}" ${pickupDisabled}>提货查询</button>
              <div class="actions">
                <button class="pay-btn alipay" type="button" data-idx="${idx}" data-channel="70" ${payDisabled}>支付宝</button>
                <button class="pay-btn ysf-android" type="button" data-idx="${idx}" data-channel="80_android" ${payDisabled}>安卓</button>
                <button class="pay-btn ysf-ios" type="button" data-idx="${idx}" data-channel="80_ios" ${payDisabled}>iOS</button>
              </div>
              <div class="sub">${payHint}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function scan() {
      if (busy) return;
      const phones = parsePhones();
      if (!phones.length) {
        toast('先粘贴手机号');
        return;
      }
      busy = true;
      scanBtn.disabled = true;
      scanBtn.textContent = '查询中...';
      try {
        const data = await api('/api/mobile/orders_scan', {
          text: phoneInput.value,
        });
        rows = Array.isArray(data.rows) ? data.rows : [];
        document.getElementById('totalNum').textContent = String(data.total || rows.length || 0);
        document.getElementById('hitNum').textContent = String(data.okCount || 0);
        document.getElementById('costNum').textContent = String(data.elapsedMs || 0) + 'ms';
        render();
        toast('查询完成：' + (data.okCount || 0) + '/' + (data.total || rows.length || 0));
      } catch (e) {
        toast(e && e.message ? e.message : e);
      } finally {
        busy = false;
        scanBtn.disabled = false;
        scanBtn.textContent = '启动查询扫描';
      }
    }

    function showLink(title, link) {
      currentLink = String(link || '');
      modalTitle.textContent = title;
      linkBox.textContent = currentLink || '未解析出可打开链接';
      openBtn.href = currentLink || '#';
      if (!currentLink) openBtn.removeAttribute('href');
      modal.classList.add('show');
    }

    async function copyText(text) {
      const value = String(text || '');
      if (!value) return false;
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return true;
      }
      const ta = document.createElement('textarea');
      ta.value = value;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }

    async function pullPay(idx, channel, btn) {
      const row = rows[idx];
      if (!row || !row.phone || !row.orderId) {
        toast('这一行没有订单号');
        return;
      }
      if (!row.hasPayNotice) {
        toast('电脑端还没有提取这个号的支付链接');
        return;
      }
      btn.disabled = true;
      try {
        const data = await api('/api/mobile/pay_link', {
          phone: row.phone,
          orderId: row.orderId,
          channel,
          payMethod: 0,
        });
        const link = pickPayLink(data, channel);
        if (link) {
          copyText(link).catch(() => {});
          showLink(channelName(channel) + '链接', link);
          toast('已拉到' + channelName(channel) + '链接');
        } else {
          showLink(channelName(channel) + '返回', JSON.stringify(data, null, 2));
          toast('未解析出直接链接');
        }
      } catch (e) {
        toast(e && e.message ? e.message : e);
      } finally {
        btn.disabled = false;
      }
    }

    async function checkPickup(idx, btn) {
      const row = rows[idx];
      if (!row || !row.phone || !row.orderId) return;
      btn.disabled = true;
      try {
        const data = await api('/api/mobile/pickup_status', {
          phone: row.phone,
          orderId: row.orderId,
          pageSize: 20,
        });
        const status = data.pickupStatus || data.statusText || data.message || '未知';
        const detail = [
          '手机号：' + (data.phone || row.phone || ''),
          '订单号：' + (data.orderId || row.orderId || ''),
          '状态：' + status,
          data.statusText ? '接口原状态：' + data.statusText : '',
          data.order && data.order.assetType ? '商品：' + data.order.assetType : '',
          data.order && data.order.time ? '时间：' + data.order.time : '',
        ].filter(Boolean).join('\n');
        showLink('提货查询', detail);
        toast('提货状态：' + status);
      } catch (e) {
        toast(e && e.message ? e.message : e);
      } finally {
        btn.disabled = false;
      }
    }

    rowsEl.addEventListener('click', ev => {
      const payBtn = ev.target.closest('button[data-channel]');
      if (payBtn) {
        pullPay(Number(payBtn.dataset.idx), payBtn.dataset.channel, payBtn);
        return;
      }
      const pickupBtn = ev.target.closest('button[data-pickup]');
      if (pickupBtn) checkPickup(Number(pickupBtn.dataset.pickup), pickupBtn);
    });

    scanBtn.addEventListener('click', scan);

    autoSwitch.addEventListener('click', () => {
      const on = !autoSwitch.classList.contains('on');
      autoSwitch.classList.toggle('on', on);
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      if (on) {
        autoTimer = setInterval(scan, 60000);
        scan();
      }
    });

    document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', ev => {
      if (ev.target === modal) modal.classList.remove('show');
    });
    copyBtn.addEventListener('click', async () => {
      if (await copyText(currentLink)) toast('已复制');
    });
  </script>
</body>
</html>
