<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>私家车 · 用户中心</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap");

:root {
  --bg: #f6f7f6;
  --bg2: #ffffff;
  --border: #e0e0dc;
  --control: #d1d5db;
  --accent: #8b6914;
  --text: #121218;
  --muted: #5c5c66;
  --faint: #5f6368;
  --radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 28px 20px 48px;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand-header { width: min(100%, 440px); margin: 0 auto 16px; }
.brand-title {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.brand-sub {
  margin-top: 8px;
  font-size: 16px;
  line-height: 1.45;
  color: var(--text);
}

.main-container {
  width: min(100%, 440px);
  margin: 0 auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 20px 22px;
}

.tab-box {
  display: flex;
  gap: 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}
.tab-item {
  appearance: none;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 8px 0 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
}
.tab-item.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

.step-hint {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 16px;
}
.block-title {
  font-size: 14px;
  font-weight: 600;
  margin: 18px 0 10px;
}
.block-title:first-of-type { margin-top: 0; }
.block-title span { font: inherit; color: inherit; }

.input-group { margin-bottom: 12px; }
.input-group label,
.grid-row label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 6px;
}
input, select, textarea {
  width: 100%;
  height: 40px;
  background: var(--bg2);
  border: 1px solid var(--control);
  border-radius: var(--radius);
  padding: 0 12px;
  font-size: 16px;
  outline: none;
}
textarea { height: 76px; padding: 10px 12px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, select:focus, textarea:focus { border-color: var(--text); }
select { padding-right: 8px; }
select:disabled { color: var(--faint); background-color: var(--bg); }
input[readonly].remark-locked { background: var(--bg); color: var(--muted); }

.remark-lock-hint { font-size: 13px; line-height: 1.45; color: var(--muted); margin: -4px 0 8px; }
.grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phone-row { display: flex; align-items: flex-end; gap: 8px; }
.phone-row .input-group { flex: 1; margin-bottom: 12px; }
.btn-code {
  height: 40px;
  margin-bottom: 12px;
  padding: 0 12px;
  border-radius: var(--radius);
  border: 1px solid var(--control);
  background: var(--bg2);
  color: var(--faint);
  font-size: 14px;
  cursor: not-allowed;
  white-space: nowrap;
}
.btn-code.enabled { color: var(--text); border-color: var(--text); cursor: pointer; font-weight: 600; }
.btn-code.enabled:hover { background: var(--bg); }

.btn-submit-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.btn-submit {
  height: 44px;
  border: none;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn-submit:disabled {
  background: var(--bg);
  color: var(--faint);
  border: 1px solid var(--control);
  cursor: not-allowed;
}
#btnCheckBlack {
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--control);
  font-weight: 500;
  height: 40px;
}
#btnCheckBlack:disabled { color: var(--faint); }

.toast {
  position: fixed;
  left: 50%;
  top: 24px;
  transform: translateX(-50%);
  display: none;
  max-width: min(420px, calc(100% - 32px));
  padding: 12px 14px;
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  font-size: 14px;
  line-height: 1.5;
  z-index: 20;
  white-space: pre-wrap;
}
.toast.visible { display: block; }

@media (max-width: 480px) {
  body { padding: 20px 16px 32px; }
  .main-container { padding: 16px; }
  .grid-row { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>

  <header class="brand-header">
    <h1 class="brand-title">私家车</h1>
    <p class="brand-sub">用短信验证码完成上号。</p>
  </header>

  <div class="main-container">
    <div class="tab-box">
      <div class="tab-item active" id="tabNew" onclick="switchTab('new')">新用户注册</div>
      <div class="tab-item" id="tabOld" onclick="switchTab('old')">老用户登录</div>
    </div>

    <div id="areaNew">
      <p class="step-hint">先填实名和地址，再取验证码。</p>

      <h2 class="block-title" id="realNameHeading">实名</h2>
      <div class="input-group">
        <label for="realName">姓名</label>
        <input type="text" id="realName" placeholder="真实姓名" maxlength="20" autocomplete="off">
      </div>
      <div class="input-group">
        <label for="idCard">身份证号</label>
        <input type="text" id="idCard" placeholder="18 位" maxlength="18" autocomplete="off">
      </div>
      <h2 class="block-title" id="newRemarkLabel">账号标签</h2>
      <div class="input-group">
        <label for="newRemark">标签</label>
        <input type="text" id="newRemark" class="remark-locked" readonly tabindex="-1" placeholder="由分享链接指定" maxlength="40" autocomplete="off">
      </div>
      <div class="remark-lock-hint" id="newRemarkLockHint">标签只认分享链接里的参数，这里不能改。</div>

      <h2 class="block-title">收货地址</h2>
      <div class="grid-row">
        <div class="input-group">
          <label for="provinceSelect">省份</label>
          <select id="provinceSelect"><option value="">省份</option></select>
        </div>
        <div class="input-group">
          <label for="citySelect">城市</label>
          <select id="citySelect" disabled><option value="">城市</option></select>
        </div>
      </div>
      <div class="grid-row">
        <div class="input-group">
          <label for="districtSelect">区县</label>
          <select id="districtSelect" disabled><option value="">区 / 县</option></select>
        </div>
        <div class="input-group">
          <label for="townSelect">街道</label>
          <select id="townSelect" disabled><option value="">街道，可空</option></select>
        </div>
      </div>
      <div class="input-group">
        <label for="detailAddress">门牌</label>
        <textarea id="detailAddress" placeholder="小区、楼栋、门牌"></textarea>
      </div>

      <input type="hidden" id="provinceId"><input type="hidden" id="cityId">
      <input type="hidden" id="districtId"><input type="hidden" id="townId">
      <input type="hidden" id="provinceName"><input type="hidden" id="cityName">
      <input type="hidden" id="districtName"><input type="hidden" id="townName">
    </div>

    <!-- 老用户区 -->
    <div id="areaOld" class="hidden">
      <p class="step-hint">只登录已有账号。标签仍由分享链接决定。</p>
      <h2 class="block-title" id="oldRemarkLabel">账号标签</h2>
      <div class="input-group">
        <label for="oldRemark">标签</label>
        <input type="text" id="oldRemark" class="remark-locked" readonly tabindex="-1" placeholder="由分享链接指定" maxlength="40" autocomplete="off">
      </div>
      <div class="remark-lock-hint" id="oldRemarkLockHint">标签只认分享链接里的参数，这里不能改。</div>
    </div>

    <h2 class="block-title" id="phoneDivider">手机验证</h2>
    <div class="phone-row">
      <div class="input-group">
        <label for="phone">手机号</label>
        <input type="tel" id="phone" placeholder="11 位" maxlength="11" inputmode="numeric">
      </div>
      <button type="button" id="btnGetCode" class="btn-code" disabled>获取验证码</button>
    </div>
    <div class="input-group">
      <label for="vcode">验证码</label>
      <input type="tel" id="vcode" placeholder="6 位短信" maxlength="6" inputmode="numeric">
    </div>

    <div class="btn-submit-wrapper">
      <button type="button" id="btnSubmit" class="btn-submit" disabled>注册并上号</button>
      <button type="button" id="btnCheckBlack" class="btn-submit" disabled>查黑号状态</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var remoteToken = qs.get('token') || '';
  // 备注/标签只认 URL：?remark= / ?tag= / ?label=，页面不可改
  var linkRemark = (qs.get('remark') || qs.get('tag') || qs.get('label') || '').trim().slice(0, 40);
  var isNewMode = true;
  var codeCountdown = 0;
  var codeTimer = null;
  var lastLoginPhone = '';

  var $ = function(id){ return document.getElementById(id); };

  function currentRemark() {
    return linkRemark;
  }

  function applyLinkRemarkLock() {
    ['newRemark', 'oldRemark'].forEach(function(id){
      var el = $(id);
      if (!el) return;
      el.value = linkRemark;
      el.readOnly = true;
      el.classList.add('remark-locked');
      el.title = '由分享链接 ?remark= / ?tag= / ?label= 指定，不可修改';
      if (!linkRemark) {
        el.placeholder = '链接未带标签参数';
      }
    });
    ['newRemarkLabel', 'oldRemarkLabel'].forEach(function(id){
      var el = $(id);
      if (el) el.innerHTML = '<span>账号标签</span>';
    });
    ['newRemarkLockHint', 'oldRemarkLockHint'].forEach(function(id){
      var el = $(id);
      if (!el) return;
      el.classList.remove('hidden');
      el.textContent = linkRemark
        ? ('标签「' + linkRemark + '」· 上号后归入同名分组')
        : '未带 ?remark= / ?tag= / ?label=，本次不上标签';
    });
  }
  applyLinkRemarkLock();
  var elPhone     = $('phone');
  var elVcode     = $('vcode');
  var elBtnCode   = $('btnGetCode');
  var elBtnSubmit = $('btnSubmit');
  var elBtnBlack  = $('btnCheckBlack');
  var elAreaNew   = $('areaNew');
  var elAreaOld   = $('areaOld');
  var elDivider   = $('phoneDivider');

  window.switchTab = function(mode) {
    isNewMode = (mode === 'new');
    $('tabNew').classList.toggle('active', isNewMode);
    $('tabOld').classList.toggle('active', !isNewMode);
    elAreaNew.classList.toggle('hidden', !isNewMode);
    elAreaOld.classList.toggle('hidden', isNewMode);
    elDivider.classList.toggle('hidden', !isNewMode);
    elBtnSubmit.innerText = isNewMode ? '注册并上号' : '立即登录';
    elPhone.value = ''; elVcode.value = '';
    resetCodeBtn();
    updateButtons();
  };

  function isValidPhone(v){ return /^1[3-9]\d{9}$/.test(v.trim()); }
  function isValidId(v){ return /(^\d{15}$)|(^\d{18}$)|(^\d{17}(\d|X|x)$)/.test(v.trim()); }

  function infoComplete() {
    if (!isValidPhone(elPhone.value)) return false;
    if (!isNewMode) return true;
    var name   = $('realName').value.trim();
    var idcard = $('idCard').value.trim();
    var detail = $('detailAddress').value.trim();
    var prov   = $('provinceId').value;
    var city   = $('cityId').value;
    var dist   = $('districtId').value;
    return !!(name && isValidId(idcard) && detail && prov && city && dist);
  }

  function canSubmit() {
    return infoComplete() && elVcode.value.trim().length === 6;
  }

  function updateButtons() {
    var canInfo = infoComplete();
    if (codeCountdown <= 0) {
      elBtnCode.disabled = !canInfo;
      elBtnCode.classList.toggle('enabled', canInfo);
    }
    elBtnSubmit.disabled = !canSubmit();
    elBtnBlack.disabled  = !isValidPhone(elPhone.value);
  }

  elPhone.addEventListener('input', function(){
    this.value = this.value.replace(/\D/g,'').slice(0,11);
    updateButtons();
  });
  elVcode.addEventListener('input', function(){
    this.value = this.value.replace(/\D/g,'').slice(0,6);
    updateButtons();
  });
  ['realName','idCard','detailAddress'].forEach(function(id){
    var el = $(id); if(el) el.addEventListener('input', updateButtons);
  });
  ['provinceSelect','citySelect','districtSelect','townSelect'].forEach(function(id){
    var el = $(id); if(el) el.addEventListener('change', updateButtons);
  });

  function startCountdown() {
    codeCountdown = 60;
    elBtnCode.disabled = true;
    elBtnCode.classList.remove('enabled');
    elBtnCode.innerText = codeCountdown + 's';
    codeTimer = setInterval(function(){
      codeCountdown--;
      if (codeCountdown <= 0) { resetCodeBtn(); }
      else { elBtnCode.innerText = codeCountdown + 's'; }
    }, 1000);
  }
  function resetCodeBtn() {
    clearInterval(codeTimer);
    codeCountdown = 0;
    elBtnCode.innerText = '获取验证码';
    updateButtons();
  }

  var _toastTimer = null;
  function toast(msg, dur) {
    var el = $('toast');
    el.innerText = msg || '';
    el.classList.add('visible');
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){
      el.classList.remove('visible');
      setTimeout(function(){ el.style.display = ''; }, 200);
    }, dur || 2500);
  }

  function api(path, body) {
    var headers = { 'Content-Type': 'application/json' };
    if (remoteToken) headers['X-Remote-Login-Token'] = remoteToken;
    var payload = Object.assign({}, body);
    if (remoteToken) payload.remoteToken = remoteToken;
    return fetch(path, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(payload)
    }).then(function(r){
      return r.json().then(function(j){ return { status: r.status, json: j }; });
    });
  }

  function ensureLoggedPersisted(phone) {
    // /api/state 不包含 accounts，远程上号需从账号接口读取实际落盘状态
    return api('/api/accounts/list', {}).then(function(x){
      var j = x.json;
      var arr = (j && j.data && j.data.accounts) || [];
      var p = String(phone || '').trim();
      var hit = null;
      for (var i = 0; i < arr.length; i++) {
        var a = arr[i] || {};
        if (String(a.phone || '').trim() === p) {
          hit = a;
          break;
        }
      }
      if (!hit) return { ok: false, message: '账号未写入后端，请重试上号' };
      if (String(hit.status || '') !== '已登录') {
        return { ok: false, message: '账号状态未完成落盘（当前：' + String(hit.status || '未知') + '），请重试上号' };
      }
      return { ok: true };
    }).catch(function(){
      return { ok: false, message: '后端状态校验失败，请检查网络后重试' };
    });
  }

  function mtOk(code) {
    return code === 2000 || code === '2000' || parseInt(code, 10) === 2000;
  }

  function normalizeLoginFailMessage(msg) {
    var s = String(msg || '');
    var expiredKeywords = ['验证码过期', '验证码已过期', '验证码失效', '短信验证码过期', '短信验证码失效'];
    if (expiredKeywords.some(function(kw){ return s.indexOf(kw) !== -1; })) {
      return '验证码已过期，请重新获取验证码后再登录';
    }
    return s || '登录失败';
  }

  elBtnCode.addEventListener('click', function(){
    if (!infoComplete()) return;
    elBtnCode.disabled = true;
    elBtnCode.innerText = '发送中...';
    api('/api/accounts/send_code', {
      phone: elPhone.value.trim(),
      remark: currentRemark(),
      deferPoolPersistUntilOnboard: false,
    })
      .then(function(x){
        var j = x.json;
        if (x.status === 403) { toast('口令无效，请联系管理员获取正确链接'); resetCodeBtn(); return; }
        var d = j && j.data;
        if (j && j.ok && mtOk(d && d.code)) {
          toast('验证码已发送，请查收短信');
          startCountdown();
          elVcode.focus();
        } else {
          toast((d && d.message) || (j && j.message) || '发送失败，请稍后重试');
          resetCodeBtn();
        }
      })
      .catch(function(){
        if (isNewMode) {
          api('/api/accounts/remote_onboard_deferred_flush', { phone: elPhone.value.trim() }).catch(function(){});
        }
        toast('网络异常，请检查连接'); resetCodeBtn();
      });
  });

  elBtnSubmit.addEventListener('click', function(){
    if (!canSubmit()) return;
    var phone = elPhone.value.trim();
    var code  = elVcode.value.trim();
    elBtnSubmit.disabled = true;
    elBtnSubmit.innerText = '处理中...';

    api('/api/accounts/login', {
      phone: phone,
      code: code,
      nickname: isNewMode ? ($('realName').value.trim() || phone) : undefined,
      remark: currentRemark(),
      deferPoolPersistUntilOnboard: false,
    })
    .then(function(x){
      var j = x.json;
      if (x.status === 403) {
        if (isNewMode) {
          api('/api/accounts/remote_onboard_deferred_flush', { phone: phone }).catch(function(){});
        }
        toast('口令无效，请联系管理员'); resetSubmit(); return;
      }
      var res = j && j.data && j.data.result;
      if (!j || !j.ok || !mtOk(res && res.code)) {
        if (isNewMode) {
          api('/api/accounts/remote_onboard_deferred_flush', { phone: phone }).catch(function(){});
        }
        toast(normalizeLoginFailMessage((res && res.message) || (j && j.message) || '登录失败'));
        resetSubmit(); return;
      }
      lastLoginPhone = phone;
      if (!isNewMode) {
        toast('登录成功');
        resetSubmit();
        elBtnBlack.disabled = false;
        return;
      }
      ensureLoggedPersisted(phone).then(function(v){
        if (!v.ok) {
          api('/api/accounts/remote_onboard_deferred_flush', { phone: phone }).catch(function(){});
          toast('登录成功但状态未就绪：' + (v.message || '请重试'));
          resetSubmit();
          return Promise.reject(new Error('persist-check-failed'));
        }
        toast('登录成功\n实名与地址均成功后将写入本机账号库，正在提交实名…');
        return submitRealnameAuto(phone);
      })
        .then(function(rnMsg){
          return submitAddress(phone).then(function(adOk){
            return { rnMsg: rnMsg, adOk: adOk };
          });
        })
        .then(function(result){
          var msg2 = result.adOk ? '地址添加成功' : '地址提交异常';
          var head = result.adOk
            ? '上号完成！实名与地址均已提交，账号已写入本机。'
            : '地址步骤未成功：账号已写入本机，请到主控补交地址或重试。';
          toast(head + '\n' + result.rnMsg + '\n' + msg2, 6000);
          resetSubmit();
          elBtnBlack.disabled = false;
        })
        .catch(function(err){
          if (isNewMode) {
            api('/api/accounts/remote_onboard_deferred_flush', { phone: phone }).catch(function(){});
          }
          if (err && err.message === 'persist-check-failed') return;
          toast('提交过程中发生异常，请检查账号状态');
          resetSubmit();
        });
    })
    .catch(function(){
      if (isNewMode) {
        api('/api/accounts/remote_onboard_deferred_flush', { phone: phone }).catch(function(){});
      }
      toast('网络异常'); resetSubmit();
    });
  });

  function resetSubmit() {
    elBtnSubmit.disabled = !canSubmit();
    elBtnSubmit.innerText = isNewMode ? '注册并上号' : '立即登录';
  }

  function submitRealnameAuto(phone) {
    var name   = $('realName').value.trim();
    var idCard = $('idCard').value.trim();
    var NEED_FIND_KEYWORDS = ['已实名','已被使用','已被绑定','已绑定','该身份','身份证已','实名信息','需找回','找回身份','findIdentity','请找回'];
    var IDENTITY_CERTIFIED_KEYWORDS = ['身份证被认证','身份证已认证','证件已认证','证件被认证','请先找回身份'];
    var DUPLICATE_OK_KEYWORDS = ['重复提交', '请稍后再试'];
    /** 找回身份后网关常返回「稍后重试」类软限流，仅查实名状态不够，需再 POST 一次 submit 才过 */
    var REALNAME_RESUBMIT_SOFT_KEYWORDS = [
      '稍后重试', '稍后再试', '请稍后', '请稍候', '操作频繁', '系统繁忙', '繁忙', '限流', 'too many', 'try again',
    ];
    var RESUBMIT_DELAY_MS = 3000;
    var REALNAME_SOFT_RETRY_DELAY_MS = 2800;

    function sleep(ms) {
      return new Promise(function(resolve){ setTimeout(resolve, ms); });
    }

    function realnameMsgNeedsResubmit(msg) {
      var s = String(msg || '');
      return REALNAME_RESUBMIT_SOFT_KEYWORDS.some(function(kw){ return s.indexOf(kw) !== -1; });
    }

    function verifyRealnameStatus() {
      return api('/api/accounts/realname/query', { phone: phone })
        .then(function(x){
          var j = x.json;
          var res = j && j.data && j.data.result;
          var vs = null;
          if (res && res.verifyStatus != null) vs = res.verifyStatus;
          else if (res && res.data && res.data.verifyStatus != null) vs = res.data.verifyStatus;
          var n = parseInt(vs, 10);
          return { ok: (n === 1 || n === 3), verifyStatus: isNaN(n) ? null : n };
        })
        .catch(function(){
          return { ok: false, verifyStatus: null };
        });
    }

    function ensureRealnameCommitted(retries, waitMs) {
      return verifyRealnameStatus().then(function(v){
        if (v.ok) return { ok: true, verifyStatus: 1 };
        if (retries <= 0) return { ok: false, verifyStatus: v.verifyStatus };
        return sleep(waitMs).then(function(){
          return ensureRealnameCommitted(retries - 1, waitMs);
        });
      });
    }

    function doSubmit() {
      return api('/api/accounts/realname/submit', {
        phone: phone, name: name, idCard: idCard, force: true
      }).then(function(x){
        var j = x.json;
        var res = j && j.data && j.data.result;
        var code = res && res.code;
        if (res && res.alreadyVerified) {
          return ensureRealnameCommitted(2, 1200).then(function(v){
            return v.ok
              ? { ok: true, needFind: false }
              : { ok: false, needFind: false, msg: '实名状态未更新（verifyStatus=' + String(v.verifyStatus == null ? '未知' : v.verifyStatus) + '）' };
          });
        }
        if (j && j.ok && (mtOk(code) || code === 2000)) {
          return ensureRealnameCommitted(2, 1200).then(function(v){
            return v.ok
              ? { ok: true, needFind: false }
              : { ok: false, needFind: false, msg: '实名提交成功但状态未更新（verifyStatus=' + String(v.verifyStatus == null ? '未知' : v.verifyStatus) + '）' };
          });
        }
        var msg = String((res && res.message) || (j && j.message) || '');
        var duplicateOk = DUPLICATE_OK_KEYWORDS.some(function(kw){ return msg.indexOf(kw) !== -1; });
        if (duplicateOk) {
          return ensureRealnameCommitted(2, 1200).then(function(v){
            return v.ok
              ? { ok: true, needFind: false }
              : { ok: false, needFind: false, msg: '实名接口返回可忽略提示，但实名状态未完成（verifyStatus=' + String(v.verifyStatus == null ? '未知' : v.verifyStatus) + '）' };
          });
        }
        var needFind = NEED_FIND_KEYWORDS.some(function(kw){ return msg.indexOf(kw) !== -1; });
        var idCertified = IDENTITY_CERTIFIED_KEYWORDS.some(function(kw){ return msg.indexOf(kw) !== -1; });
        return { ok: false, needFind: needFind, idCertified: idCertified, msg: msg };
      }).then(function(result){
        if (result && !result.ok) {
          result.needFind = !!(result.needFind || result.idCertified);
        }
        return result;
      }).catch(function(){ return { ok: false, needFind: false, msg: '网络异常' }; });
    }

    return api('/api/accounts/find_identity', {
      phone: phone, name: name, idCard: idCard
    }).then(function(x){
      var j = x.json;
      var res = j && j.data && j.data.result;
      var findOk = !!(j && j.ok && mtOk((res && res.code) || (j.data && j.data.code)));
      if (!findOk) {
        var findMsg = (res && res.message) || (j && j.data && j.data.message) || (j && j.message) || '失败';
        return '找回身份：' + findMsg;
      }
      return '找回身份成功';
    }).catch(function(){
      return '找回身份网络异常';
    }).then(function(findDesc){
      return sleep(RESUBMIT_DELAY_MS).then(function(){
        return doSubmit();
      }).then(function(r1){
        if (r1.ok) return findDesc + '\n实名认证成功';
        if (realnameMsgNeedsResubmit(r1.msg)) {
          return sleep(REALNAME_SOFT_RETRY_DELAY_MS).then(function(){
            return doSubmit();
          }).then(function(r2){
            if (r2.ok) return findDesc + '\n实名认证成功（接口提示限流，已自动重试提交）';
            return findDesc + '\n实名提交失败：' + (r2.msg || r1.msg || '未知');
          });
        }
        return findDesc + '\n实名提交失败：' + (r1.msg || '未知');
      });
    });
  }

  function submitAddress(phone) {
    return api('/api/accounts/address_upsert', {
      phone: phone,
      address: {
        shipAddressId: 0,
        name:          $('realName').value.trim(),
        mobile:        phone,
        address:       $('detailAddress').value.trim(),
        provinceId:    $('provinceId').value,
        provinceName:  $('provinceName').value,
        cityId:        $('cityId').value,
        cityName:      $('cityName').value,
        districtId:    $('districtId').value,
        districtName:  $('districtName').value,
        townId:        ($('townId').value || '').trim() || '-1',
        townName:      ($('townId').value || '').trim() ? ($('townName').value || '').trim() : '',
        dft:           true,
        grey:          false,
        recent:        false
      }
    }).then(function(x){
      var j = x.json;
      var res = j && j.data && j.data.result;
      return !!(j && j.ok && mtOk(res && res.code));
    }).catch(function(){ return false; });
  }

  elBtnBlack.addEventListener('click', function(){
    var phone = lastLoginPhone || elPhone.value.trim();
    if (!isValidPhone(phone)) { toast('请先登录成功后再检测'); return; }
    elBtnBlack.disabled = true;
    elBtnBlack.innerText = '检测中...';
    api('/api/accounts/remote_black_check', { phone: phone, maxRetries: 50 })
      .then(function(x){
        var j = x.json;
        if (x.status === 403) { toast('口令无效'); return; }
        var r = (j && j.data && j.data.result) || {};
        var tagMap = { normal:'正常账号', blacklisted:'黑号', possibly_blacklisted:'疑似黑号', token_expired:'Token失效', probe_error:'检测异常' };
        var tag   = r.risk_tag || r.status || 'probe_error';
        var label = tagMap[tag] || tag;
        toast(label + (r.message ? '\n' + r.message : ''), 4000);
      })
      .catch(function(){ toast('网络异常'); })
      .finally(function(){
        elBtnBlack.disabled = false;
        elBtnBlack.innerText = '查黑号状态';
        updateButtons();
      });
  });

  // ── 省市区级联 ──
  var PCAS_CACHE_KEY = 'rush_addr_region_pcas_v1';
  var REGION_TREE = {};

  function normRegionCode(code) {
    var raw = String(code == null ? '' : code).trim().replace(/\D/g, '');
    if (!raw) return '';
    if (raw.length >= 9) return raw.slice(0, 9);
    if (raw.length === 6) return raw + '000';
    if (raw.length === 4) return raw + '00000';
    if (raw.length === 2) return raw + '0000000';
    return raw;
  }

  function upsertRemoteRegion(pid, pname, cid, cname, did, dname, tid, tname) {
    tid = tid || ''; tname = tname || '';
    if (!pid || !pname || !cid || !cname || !did || !dname) return;
    if (!REGION_TREE[pid]) REGION_TREE[pid] = { name: pname, cities: {} };
    REGION_TREE[pid].name = pname;
    if (!REGION_TREE[pid].cities[cid]) REGION_TREE[pid].cities[cid] = { name: cname, districts: {} };
    REGION_TREE[pid].cities[cid].name = cname;
    if (!REGION_TREE[pid].cities[cid].districts[did]) {
      REGION_TREE[pid].cities[cid].districts[did] = { name: dname, towns: {} };
    }
    REGION_TREE[pid].cities[cid].districts[did].name = dname;
    if (tid && tname) REGION_TREE[pid].cities[cid].districts[did].towns[tid] = tname;
  }

  function mergePcasRows(rows) {
    var provinces = Array.isArray(rows) ? rows : [];
    for (var pi = 0; pi < provinces.length; pi++) {
      var p = provinces[pi];
      if (!p || typeof p !== 'object') continue;
      var pid = normRegionCode(p.code);
      var pname = String(p.name || '').trim();
      var cities = Array.isArray(p.children) ? p.children : [];
      for (var ci = 0; ci < cities.length; ci++) {
        var c = cities[ci];
        if (!c || typeof c !== 'object') continue;
        var cid = normRegionCode(c.code);
        var cname = String(c.name || '').trim();
        var districts = Array.isArray(c.children) ? c.children : [];
        for (var di = 0; di < districts.length; di++) {
          var d = districts[di];
          if (!d || typeof d !== 'object') continue;
          var did = normRegionCode(d.code);
          var dname = String(d.name || '').trim();
          upsertRemoteRegion(pid, pname, cid, cname, did, dname, '', '');
          var towns = Array.isArray(d.children) ? d.children : [];
          for (var ti = 0; ti < towns.length; ti++) {
            var t = towns[ti];
            if (!t || typeof t !== 'object') continue;
            var tid = normRegionCode(t.code);
            var tname = String(t.name || '').trim();
            upsertRemoteRegion(pid, pname, cid, cname, did, dname, tid, tname);
          }
        }
      }
    }
  }

  function pcasFetchUrls() {
    var out = [];
    try {
      if (location.origin && location.protocol !== 'file:') {
        out.push(location.origin.replace(/\/$/, '') + '/api/address/pcas');
      }
    } catch (e1) {}
    out.push(
      'https://cdn.jsdelivr.net/gh/modood/Administrative-divisions-of-China@master/dist/pcas-code.json',
      'https://fastly.jsdelivr.net/gh/modood/Administrative-divisions-of-China@master/dist/pcas-code.json'
    );
    return out;
  }

  function fetchPcasAt(urls, idx) {
    if (idx >= urls.length) return Promise.reject(new Error('pcas_all_failed'));
    var ctrl = new AbortController();
    var tm = setTimeout(function () { try { ctrl.abort(); } catch (e2) {} }, 90000);
    return fetch(urls[idx], { signal: ctrl.signal })
      .then(function (r) {
        clearTimeout(tm);
        if (!r.ok) throw new Error('http');
        return r.json();
      })
      .then(function (j) {
        if (!Array.isArray(j) || j.length < 10) throw new Error('bad_json');
        return j;
      })
      .catch(function () {
        clearTimeout(tm);
        return fetchPcasAt(urls, idx + 1);
      });
  }

  function loadRegionDatabase() {
    var sel = $('provinceSelect');
    sel.innerHTML = '<option value="">正在加载行政区…</option>';
    sel.disabled = true;
    try {
      var cached = localStorage.getItem(PCAS_CACHE_KEY);
      if (cached) mergePcasRows(JSON.parse(cached));
    } catch (e3) {}
    if (Object.keys(REGION_TREE).length >= 5) {
      sel.disabled = false;
      renderProvinces();
      return Promise.resolve();
    }
    return fetchPcasAt(pcasFetchUrls(), 0)
      .then(function (j) {
        mergePcasRows(j);
        try { localStorage.setItem(PCAS_CACHE_KEY, JSON.stringify(j)); } catch (e4) {}
        sel.disabled = false;
        renderProvinces();
      })
      .catch(function (err) {
        console.warn(err);
        toast('全国地址库加载失败，请与主控页同域打开或检查网络后刷新', 4000);
        sel.disabled = false;
        renderProvinces();
      });
  }

  function renderProvinces() {
    var sel = $('provinceSelect');
    sel.innerHTML = '<option value="">省份</option>';
    var keys = Object.keys(REGION_TREE).sort();
    if (!keys.length) { sel.innerHTML = '<option value="">（地址库未加载）</option>'; return; }
    keys.forEach(function (pid) {
      var o = document.createElement('option');
      o.value = pid;
      o.textContent = REGION_TREE[pid].name;
      sel.appendChild(o);
    });
  }

  $('provinceSelect').addEventListener('change', function () {
    var pid = this.value;
    var pname = this.options[this.selectedIndex] ? this.options[this.selectedIndex].text : '';
    $('provinceId').value = pid;
    $('provinceName').value = pid ? pname : '';
    var cs = $('citySelect');
    cs.innerHTML = '<option value="">城市</option>'; cs.disabled = true;
    var ds = $('districtSelect');
    ds.innerHTML = '<option value="">区 / 县</option>'; ds.disabled = true;
    var ts = $('townSelect');
    ts.innerHTML = '<option value="">街道（可选）</option>'; ts.disabled = true;
    $('cityId').value = ''; $('districtId').value = ''; $('townId').value = '';
    $('cityName').value = ''; $('districtName').value = ''; $('townName').value = '';
    var prov = REGION_TREE[pid];
    if (prov && prov.cities) {
      Object.keys(prov.cities).sort().forEach(function (cid) {
        var c = prov.cities[cid];
        var o = document.createElement('option');
        o.value = cid; o.textContent = c.name;
        cs.appendChild(o);
      });
      cs.disabled = false;
    }
    updateButtons();
  });

  $('citySelect').addEventListener('change', function () {
    var pid = $('provinceId').value;
    var cid = this.value;
    var cname = this.options[this.selectedIndex] ? this.options[this.selectedIndex].text : '';
    $('cityId').value = cid; $('cityName').value = cid ? cname : '';
    var ds = $('districtSelect');
    ds.innerHTML = '<option value="">区 / 县</option>'; ds.disabled = true;
    var ts = $('townSelect');
    ts.innerHTML = '<option value="">街道（可选）</option>'; ts.disabled = true;
    $('districtId').value = ''; $('townId').value = '';
    $('districtName').value = ''; $('townName').value = '';
    var city = REGION_TREE[pid] && REGION_TREE[pid].cities[cid];
    if (city && city.districts) {
      Object.keys(city.districts).sort().forEach(function (did) {
        var d = city.districts[did];
        var o = document.createElement('option');
        o.value = did; o.textContent = d.name;
        ds.appendChild(o);
      });
      ds.disabled = false;
    }
    updateButtons();
  });

  $('districtSelect').addEventListener('change', function () {
    var pid = $('provinceId').value;
    var cid = $('cityId').value;
    var did = this.value;
    var dname = this.options[this.selectedIndex] ? this.options[this.selectedIndex].text : '';
    $('districtId').value = did; $('districtName').value = did ? dname : '';
    var ts = $('townSelect');
    ts.innerHTML = '<option value="">街道（可选）</option>'; ts.disabled = true;
    $('townId').value = ''; $('townName').value = '';
    var dnode = REGION_TREE[pid] && REGION_TREE[pid].cities[cid] && REGION_TREE[pid].cities[cid].districts[did];
    var towns = (dnode && dnode.towns) || {};
    Object.keys(towns).sort().forEach(function (tid) {
      var tn = towns[tid];
      var tname = typeof tn === 'string' ? tn : String((tn && tn.name) || '');
      if (!tname) return;
      var o = document.createElement('option');
      o.value = tid; o.textContent = tname;
      ts.appendChild(o);
    });
    if (ts.options.length > 1) ts.disabled = false;
    updateButtons();
  });

  $('townSelect').addEventListener('change', function () {
    $('townId').value = this.value;
    $('townName').value = this.value && this.options[this.selectedIndex] ? this.options[this.selectedIndex].text : '';
  });

  loadRegionDatabase().finally(function () { switchTab('new'); });
})();
</script>
